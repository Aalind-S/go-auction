<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BidSphere | Sign In</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Stylesheet -->
    <link rel="stylesheet" href="../css/style.css">
    <!-- Custom positioning for centered card -->
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .login-container {
            width: 100%;
            max-width: 440px;
            animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .login-card {
            padding: 40px;
        }
        .login-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .login-header .logo {
            margin: 0 auto 16px auto;
            width: 48px;
            height: 48px;
        }
        .login-header h2 {
            font-size: 1.8rem;
            margin-bottom: 8px;
        }
        .login-header p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }
        .card-footer {
            margin-top: 24px;
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-muted);
        }
        .card-footer a {
            font-weight: 600;
        }
        .back-home {
            position: absolute;
            top: 24px;
            left: 24px;
        }
    </style>
</head>
<body>
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>

    <!-- Back to Home -->
    <a href="/" class="btn btn-secondary back-home">
        <i data-lucide="arrow-left"></i> Home
    </a>

    <div class="login-container">
        <div class="glass-card login-card">
            <div class="login-header">
                <div class="logo-icon logo">
                    <i data-lucide="gavel"></i>
                </div>
                <h2>Welcome Back</h2>
                <p>Sign in to continue to BidSphere</p>
            </div>

            <form id="login-form" class="auth-form">
                <div class="form-group">
                    <label for="login-email"><i data-lucide="mail"></i> Email Address</label>
                    <input type="email" id="login-email" required placeholder="name@example.com" autofocus>
                </div>
                <div class="form-group">
                    <label for="login-password"><i data-lucide="lock"></i> Password</label>
                    <input type="password" id="login-password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary btn-block">
                    Sign In <i data-lucide="arrow-right"></i>
                </button>
            </form>

            <div class="card-footer">
                Don't have an account? <a href="/signup">Create Account</a>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container" class="toast-container"></div>

    <script src="../js/login.js"></script>
</body>
</html>
